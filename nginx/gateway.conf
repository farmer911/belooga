# Belooga Edge Reverse-Proxy & API Gateway Configuration (BEL-513 / BEL-137)
#
# Scope: local / docker-compose edge on :8080 (plain HTTP).
# Production TLS terminates at the Kubernetes Ingress (cert-manager, see
# k8s/deployment-and-hpa.yaml); this file is not deployed to the cluster.
# If you ever run this nginx directly on the internet, add a `listen 443 ssl`
# server with ssl_certificate/ssl_certificate_key + HSTS instead of exposing :8080.

upstream belooga_backend {
    server backend:8000;
    keepalive 32;
}

upstream belooga_frontend {
    server host.docker.internal:3000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=belooga_api_limit:10m rate=100r/s;
limit_req_status 429;

# Client IP: this nginx is the first hop, so $remote_addr is the real client.
# Behind a load balancer, trust only its CIDR, e.g.:
#   set_real_ip_from 10.0.0.0/8;
#   real_ip_header X-Forwarded-For;

server {
    listen 8080;
    server_name localhost;
    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-protobuf;
    gzip_min_length 512;

    # NOTE: nginx drops these if a location sets its own add_header, so any location
    # with add_header must repeat them (see /uploads/).
    add_header X-Edge-Gateway "belooga-nginx-edge" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Overwrite (not append) X-Forwarded-For so the app trusts exactly one hop and a
    # client-supplied header cannot spoof its IP for rate limiting.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/ {
        limit_req zone=belooga_api_limit burst=200 nodelay;
        proxy_pass http://belooga_backend/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://belooga_backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Edge-Gateway "belooga-nginx-edge" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /health {
        proxy_pass http://belooga_backend/health;
        proxy_http_version 1.1;
    }

    # API docs: private networks only (localhost / docker bridge). The backend is
    # expected to disable /docs, /redoc and /openapi.json when ENVIRONMENT=production.
    location ~ ^/(docs|redoc|openapi\.json) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://belooga_backend;
    }

    location / {
        proxy_pass http://belooga_frontend/;
        proxy_http_version 1.1;
    }
}
