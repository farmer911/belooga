# Belooga Edge Reverse-Proxy & API Gateway Configuration (BEL-513 / BEL-137)
upstream belooga_backend {
    server backend:8000;
    keepalive 32;
}

upstream belooga_frontend {
    server host.docker.internal:3000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=belooga_api_limit:10m rate=100r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name localhost;
    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-protobuf;
    gzip_min_length 512;

    add_header X-Edge-Gateway "belooga-nginx-edge" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /v1/ {
        limit_req zone=belooga_api_limit burst=200 nodelay;
        proxy_pass http://belooga_backend/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://belooga_backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /health {
        proxy_pass http://belooga_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://belooga_backend/docs;
    }

    location /openapi.json {
        proxy_pass http://belooga_backend/openapi.json;
    }

    location / {
        proxy_pass http://belooga_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
