# 🐋 Belooga Platform Architecture

## 1. Candidate Workspace & Video Studio
- **Candidate Workspace (`/user/[username]`)**
  - **Sticky Bio Sidebar (`fe-page-workspace`)**
    - Avatar, Full Name, Title, Contact Info
    - Seeking Status (`Actively Looking`, `Full-Time`)
    - Download PDF Resume trigger (`GET /v1/profile/{username}/pdf/`)
  - **30s Video Elevator Pitch Player**
    - Custom HTML5 Video Player with branded poster
    - Video playback controls, volume, fullscreen
    - Storage path: `/uploads/videos/[username]_pitch.webm`
  - **WebRTC Pitch Recording Studio Modal**
    - Camera / Mic live stream capture (`navigator.mediaDevices`)
    - 3-2-1 Countdown & 30-second hard limit recording timer
    - Interactive Teleprompter with scroll speed control & silence detection
    - Chunked video upload engine (`POST /v1/media/upload/chunk` + `complete`)
  - **Career Experience Timeline (Drag & Drop)**
    - Chronological job cards (Company, Role, Dates, Responsibilities)
    - Reorder lock with optimistic drag-and-drop (`POST /v1/timeline/job-experiences/reorder`)
    - Inline CRUD modal (Create, Edit, Delete job experience)
  - **Academic Education Timeline**
    - Degree, University, GPA, Graduation Year
    - Drag-and-drop order persistence (`POST /v1/timeline/education/reorder`)
  - **Skills, Languages & Personal Interests Badges**
    - Interactive skill tag additions (`POST /v1/profile/skills/`)
    - Master taxonomy catalog lookup (`GET /v1/catalogs/skills`)
    - Native/Fluent spoken languages badges (`profile_languages`)
    - Personal interests & hobbies tags (`profile_interests`)

- **Profile Editor (`/user/[username]/update`)**
  - **Avatar Upload & Interactive Cropper**
    - Circular crop modal (`react-easy-crop`)
    - Secure upload to `/uploads/avatars/` (`POST /v1/media/avatar/`)
  - **Biographical Data Form**
    - First Name, Last Name, Headline, Location, Bio
    - Mutations guarded by ownership (`PUT /v1/profile/`)
  - **Catalog Selectors**
    - Standardized companies dropdown (`GET /v1/catalogs/companies`)
    - Accredited universities dropdown (`GET /v1/catalogs/schools`)
    - Standardized cities dropdown (`GET /v1/catalogs/locations`)

- **Account Settings & Security (`/user/[username]/settings`)**
  - **Credential Management**
    - Primary email change request flow (`POST /v1/auth/email/change/`)
    - Argon2id password rotation (`POST /v1/auth/password/change/`)
  - **Privacy & Stealth Controls**
    - Profile visibility toggle (`is_hidden` boolean: `PATCH /v1/profile/visibility/`)
    - Hidden profile hides candidates from `/search` and denies anonymous `/public` views
  - **Session Vault & Refresh Token Rotation**
    - Family-based token replay detection vault (`refresh_sessions` table)
    - Active sessions revocation & logout (`POST /v1/auth/logout/`)
  - **Danger Zone**
    - Irreversible account deletion modal (`DELETE /v1/profile/`)

## 2. Talent Discovery & Public Showcases
- **Talent Discovery & Search (`/search`)**
  - **Instant Search Input**
    - 300ms debounced input
    - Real-time autocomplete suggestions (`GET /v1/search/suggestions/?q=`)
    - Strict GIN `search_vector` TSVECTOR execution (Zero `OR ILIKE` fallback, ADR-005)
  - **Candidate Result Cards**
    - 30s Video Elevator Pitch thumbnail badge
    - Headline, location, and verified top skills badges
    - Direct recruiter navigation to public profile
  - **Pagination & Filters**
    - Numeric pagination (`« 1 2 3 »`) (`GET /v1/search/?q=&page=&limit=12`)
    - Role, skill, and seeking status facet filters

- **Public Candidate View (`/public/[username]`)**
  - **Recruiter Read-Only Showcase**
    - Candidate bio header and verified skills
    - 30s Video Elevator Pitch embed
    - Full career and education chronology
  - **Action Toolbar**
    - Export & download ReportLab PDF resume (`GET /v1/profile/{username}/pdf/`)
    - PII protection guard (Hides phone/email from anonymous visitors)
  - **Moderation & Safety**
    - "Report Candidate" modal with abuse reason categories (`POST /v1/cms/report-profile/`)

- **Homepage & Public Showcase (`/`)**
  - **Hero Section & Dynamic CTA**
    - Catchy headline & value proposition
    - Primary action buttons: "Find Talent" (`/search`) & "Create Pitch" (`/register`)
  - **Walkthrough Video Modal**
    - Interactive product demonstration video player
  - **Featured Talent Grid**
    - Real candidate profile cards preview
  - **3-Step Process Guide**
    - 1. Record 30s Pitch • 2. Build Interactive Timeline • 3. Get Hired

## 3. Authentication & Onboarding
- **Candidate Login (`/(auth)/login`)**
  - Split-screen branded layout with `#d7ecea` overlay
  - Social OAuth triggers (Google, LinkedIn, Facebook)
  - Email / Password form (`POST /v1/auth/login`)
  - Issues secure HTTP-only refresh cookie + JWT access token
- **Candidate Registration (`/(auth)/register`)**
  - Instant username availability probe (`GET /v1/auth/check-username?u=`)
  - Email uniqueness check & password strength meter
  - Legal terms acceptance & registration execution (`POST /v1/auth/register`)
- **Password Recovery (`/(auth)/forgot-password`)**
  - Time-limited password reset token issuance (`POST /v1/auth/forgot-password`)
- **Password Reset Gateway (`/(auth)/reset-password`)**
  - Token validity verification & new password input (`POST /v1/auth/reset-password`)

## 4. Public CMS & Platform Legal
- **Editorial Blog (`/(public)/blog`)**
  - Curated career advice articles & hiring trends
- **Careers Page (`/(public)/careers`)**
  - Belooga open positions listing (`GET /v1/cms/careers`)
  - Job application modal with resume upload (`POST /v1/cms/apply`)
- **Contact Us (`/(public)/contact-us`)**
  - Public inquiry form (`POST /v1/cms/contact`)
  - Stored in PostgreSQL `contact_inquiries` table
- **Help Center & FAQs (`/(public)/help`)**
  - Categorized accordion FAQs for Candidates & Recruiters
- **Legal & Compliance**
  - Privacy Policy (`/(public)/privacy-policy`)
  - Terms of Service (`/(public)/terms-and-conditions`)
