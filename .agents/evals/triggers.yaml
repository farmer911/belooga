# Belooga Skill Trigger Evaluation Dataset (23 Consolidated Top-Tier S Skills)
# 3 prompts per skill: 2 positive (should_trigger), 1 confusion negative (should_not_trigger)

- skill: be-domain-core
  should_trigger:
    - "Sửa logic refresh token family rotation, cập nhật bio profile ứng viên và khóa with_for_update khi reorder timeline"
    - "Xử lý tải lên video chunk upload và xuất file PDF hồ sơ ứng viên bằng ReportLab"
  should_not_trigger:
    - prompt: "Sửa component video player và kéo thả timeline trên giao diện workspace"
      expected: fe-domain-workspace

- skill: be-domain-discovery
  should_trigger:
    - "Tối ưu tìm kiếm ứng viên bằng TSVECTOR ts_rank và tra cứu danh mục kỹ năng, lương trong catalogs"
    - "Thêm API gửi liên hệ contact inquiry và báo cáo hồ sơ vi phạm report profile"
  should_not_trigger:
    - prompt: "Chỉnh sửa bộ lọc tìm kiếm và trang liên hệ contact us trên giao diện"
      expected: fe-domain-public

- skill: be-domain-monetization
  should_trigger:
    - "Sửa thuật toán chấm điểm ATS scan, quản lý Kanban job tracker và đặt lịch Expert CV Review trong backend"
    - "Xác thực chữ ký HMAC-SHA256 cho webhook MoMo IPN và tổng hợp doanh thu tại /v1/analytics/dashboard"
  should_not_trigger:
    - prompt: "Sửa giao diện ATS scorecard, bảng Kanban và biểu đồ doanh thu trên frontend"
      expected: fe-domain-career-tools

- skill: fe-domain-workspace
  should_trigger:
    - "Nút ghi hình pitch không tắt camera khi đóng modal WebRTC studio trên trang workspace"
    - "Sửa form đăng nhập, đăng ký và trang cài đặt tài khoản /user/[username]/settings"
  should_not_trigger:
    - prompt: "Sửa giao diện xem hồ sơ công khai của ứng viên cho recruiter"
      expected: fe-domain-public

- skill: fe-domain-public
  should_trigger:
    - "Sửa nút play video trên trang chủ, bộ lọc trang /search và trang hồ sơ công khai /public/[username]"
    - "Cập nhật nội dung FAQ, blog, careers và trang điều khoản sử dụng"
  should_not_trigger:
    - prompt: "Cải thiện tốc độ câu query ts_rank trên backend search"
      expected: be-domain-discovery

- skill: fe-domain-career-tools
  should_trigger:
    - "Sửa giao diện ATS diagnostics, hộp thoại thanh toán MoMo QR, CV Studio và bảng giá Expert Review"
    - "Cập nhật bảng Kanban theo dõi việc làm tại /workspace/jobs và trang /admin/analytics"
  should_not_trigger:
    - prompt: "Sửa thuật toán tính điểm ATS và lưu đơn hàng trong cơ sở dữ liệu backend"
      expected: be-domain-monetization

- skill: belooga-backend-engineering
  should_trigger:
    - "Thiết kế cấu trúc service và repository mới cho backend FastAPI"
    - "Quy chuẩn xử lý transaction và database connection pool asyncpg"
  should_not_trigger:
    - prompt: "Viết test pytest kiểm tra IDOR guard cho endpoint"
      expected: tdd-workflow

- skill: belooga-frontend-engineering
  should_trigger:
    - "Tổ chức atomic components và custom hook trong frontend Next.js"
    - "Cấu hình Tailwind CSS v4 tokens và theme hệ thống"
  should_not_trigger:
    - prompt: "Viết test visual regression cho nút bấm play"
      expected: belooga-qc-engineering

- skill: belooga-qc-engineering
  should_trigger:
    - "Viết kịch bản Playwright E2E test cho luồng đăng ký ứng viên"
    - "Cấu hình visual regression threshold trong playwright config"
  should_not_trigger:
    - prompt: "Kiểm tra kiểu dữ liệu TypeScript không dùng any"
      expected: fe-code-review

- skill: engineering-integrity-and-evidence
  should_trigger:
    - "Tuân thủ nguyên tắc zero-hallucination và bằng chứng test chạy thật"
    - "Đối chiếu asset CSS và layout với thư mục legacy/"
  should_not_trigger:
    - prompt: "Viết test case Playwright E2E mới"
      expected: belooga-qc-engineering

- skill: tdd-workflow
  should_trigger:
    - "Áp dụng chu trình Red-Green-Refactor khi sửa lỗi backend"
    - "Tạo test case thất bại trước khi viết code logic xử lý"
  should_not_trigger:
    - prompt: "Đánh giá chất lượng code backend trước khi merge PR"
      expected: be-code-review

- skill: definition-of-done
  should_trigger:
    - "Kiểm tra tiêu chí DoD trước khi hoàn tất tính năng mới"
    - "Kiểm tra ngưỡng ratchet và zero schema drift cho PR"
  should_not_trigger:
    - prompt: "Ghi lại bài học kinh nghiệm sau sự cố vào sổ vi phạm"
      expected: belooga-self-learn

- skill: belooga-self-learn
  should_trigger:
    - "Ghi nhận bài học kinh nghiệm và cập nhật docs/VIOLATIONS_REGISTER.md"
    - "Phân tích nguyên nhân gốc rễ và thêm quy tắc phòng ngừa lỗi lặp lại"
  should_not_trigger:
    - prompt: "Kiểm tra tiêu chuẩn Definition of Done của PR"
      expected: definition-of-done

- skill: be-code-review
  should_trigger:
    - "Review code backend FastAPI: kiểm tra IDOR, SQL injection, async loop"
    - "Đánh giá việc phân chia Controller - Service - Repository trong backend"
  should_not_trigger:
    - prompt: "Review component React: hook dependencies và memoization"
      expected: fe-code-review

- skill: fe-code-review
  should_trigger:
    - "Review code frontend Next.js: kiểm tra memory leak hook và any type"
    - "Kiểm tra độ dài component page.tsx không vượt quá giới hạn ratchet"
  should_not_trigger:
    - prompt: "Review endpoint FastAPI và SQLAlchemy repository"
      expected: be-code-review

- skill: ponytail
  should_trigger:
    - "Đơn giản hóa giải pháp tối đa theo nguyên tắc YAGNI và stdlib"
    - "User yêu cầu làm theo phong cách lazy senior dev ngắn nhất"
  should_not_trigger:
    - prompt: "Quét toàn bộ codebase tìm code thừa và over-engineering"
      expected: ponytail-audit

- skill: ponytail-review
  should_trigger:
    - "Review diff để loại bỏ abstraction thừa và boilerplate không cần thiết"
    - "Kiểm tra PR xem có thể thay thế thư viện bằng standard library"
  should_not_trigger:
    - prompt: "Kiểm tra bảo mật IDOR và async I/O trong backend"
      expected: be-code-review

- skill: ponytail-audit
  should_trigger:
    - "Audit toàn bộ repository tìm code bloat và thư viện không cần thiết"
    - "Lập danh sách các phần code có thể xóa bỏ để tối ưu repo"
  should_not_trigger:
    - prompt: "Liệt kê danh sách các ghi chú ponytail debt trong code"
      expected: ponytail-debt

- skill: ponytail-debt
  should_trigger:
    - "Thu thập và thống kê tất cả các comment ponytail debt trong codebase"
    - "Báo cáo nợ kỹ thuật từ các shortcut đã đánh dấu ponytail:"
  should_not_trigger:
    - prompt: "Ghi nhận vi phạm quy chuẩn vào sổ vi phạm"
      expected: belooga-self-learn

- skill: investigate
  should_trigger:
    - "/investigate điều tra nguyên nhân gốc rễ lỗi và lập kế hoạch Option A/B vào STATE.md"
    - "Phân tích luồng gọi hàm read-only và đề xuất phương án trước khi viết code"
  should_not_trigger:
    - prompt: "Viết test thất bại Red rồi sửa code ngay"
      expected: tdd-workflow

- skill: belooga-supervisor
  should_trigger:
    - "Đánh giá phản biện ý tưởng tính năng mới theo PRODUCT_THESIS.md và chống Yes-Man"
    - "Kiểm tra ROI kinh doanh, rủi ro hệ thống và áp dụng Ponytail compression"
  should_not_trigger:
    - prompt: "Kiểm tra tiêu chuẩn hoàn thành PR cuối cùng"
      expected: definition-of-done

- skill: belooga-senior-agile-workflow
  should_trigger:
    - "Chia nhỏ tính năng thành các ticket Kanban, ước lượng story points và tạo nhánh git feature"
    - "Thực hiện quy trình tạo Pull Request và đồng bộ trạng thái với Kanban Belooga"
  should_not_trigger:
    - prompt: "Chỉ điều tra lỗi read-only không tạo branch hay sửa code"
      expected: investigate

- skill: ui-ux-pro-max
  should_trigger:
    - "Tra cứu bảng màu, cặp font chữ và checklist thiết kế UI/UX cho SaaS"
    - "Chạy script search.py tạo design system và kiểm tra tương phản dark mode"
  should_not_trigger:
    - prompt: "Sửa lỗi logic lưu access token trong Zustand store"
      expected: fe-domain-workspace
