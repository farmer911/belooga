# Belooga Skill Trigger Evaluation Dataset
# 3 prompts per skill: 2 positive (should_trigger), 1 confusion negative (should_not_trigger)

- skill: be-service-auth
  should_trigger:
    - "Sửa logic refresh token family rotation khi hết hạn cookie"
    - "Hash mật khẩu đăng ký ứng viên bằng Argon2 hoặc bcrypt"
  should_not_trigger:
    - prompt: "Chỉnh sửa họ tên và bio trong profile ứng viên"
      expected: be-service-profile

- skill: be-service-profile
  should_trigger:
    - "Cập nhật bio và headline của ứng viên qua API profile"
    - "Ẩn hồ sơ ứng viên is_hidden và chặn truy cập public"
  should_not_trigger:
    - prompt: "Sửa endpoint thêm công việc trong lịch sử làm việc"
      expected: be-service-timeline

- skill: be-service-timeline
  should_trigger:
    - "Thêm API sửa một mục kinh nghiệm làm việc"
    - "Reorder education đang bị lost update khi kéo thả nhanh"
  should_not_trigger:
    - prompt: "Kéo thả timeline trên UI bị giật"
      expected: fe-page-workspace

