# TEMPLATE ONLY - placeholder values. Never commit real secrets; deploy.yml never applies this file.
#
# Create the real Secret once per cluster/namespace, e.g. from a local env file:
#   kubectl create secret generic belooga-secrets --from-env-file=belooga-secrets.env
# or copy this file to k8s/secrets.yaml (gitignored), fill it in, and `kubectl apply -f k8s/secrets.yaml`.
# Required keys: DATABASE_URL, REDIS_URL, JWT_SECRET, MOMO_SECRET_KEY. The rest are optional.
apiVersion: v1
kind: Secret
metadata:
  name: belooga-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://belooga:CHANGE_ME@postgres.example.internal:5432/belooga_db"
  REDIS_URL: "redis://:CHANGE_ME@redis.example.internal:6379/0"
  JWT_SECRET: "CHANGE_ME_64_random_bytes"
  MOMO_SECRET_KEY: "CHANGE_ME"
  MOMO_PARTNER_CODE: "CHANGE_ME"
  MOMO_ACCESS_KEY: "CHANGE_ME"
  GOOGLE_CLIENT_ID: "CHANGE_ME.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  SMTP_HOST: "smtp.example.com"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
