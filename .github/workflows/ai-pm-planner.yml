name: Belooga AI PM Planner

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  plan-idea:
    name: AI PM Decomposition
    # Only run on issues with label 'type:idea'
    if: contains(github.event.issue.labels.*.name, 'type:idea') && !contains(github.event.issue.labels.*.name, 'status:in-progress')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI PM Manager Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ai-pm-manager.py ${{ github.event.issue.number }}
