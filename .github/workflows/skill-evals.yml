name: Belooga Skill Routing Evals

# Runs .agents/evals/triggers.yaml against the skill descriptions with Gemini.
# Scheduled/manual only: it costs API calls and is non-deterministic, so it is not a PR gate.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      min_accuracy:
        description: "Fail below this accuracy (0-1)"
        required: false
        default: "0.8"

permissions:
  contents: read

jobs:
  eval-triggers:
    name: Skill Trigger Accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Evaluate skill routing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIN_ACCURACY: ${{ inputs.min_accuracy || '0.8' }}
        run: python3 scripts/eval-triggers.py --min "$MIN_ACCURACY"
