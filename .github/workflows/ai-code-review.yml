name: Belooga AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ai-review-pr:
    name: ${{ matrix.domain }} AI Review Agent (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # backend = be-code-review, frontend = fe-code-review, other = .agents/ docs/ qc/ k8s/ nginx/ .github/
        domain: [backend, frontend, mobile, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run ${{ matrix.domain }} AI Reviewer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_DOMAIN: ${{ matrix.domain }}
        run: python3 scripts/ai-code-reviewer.py "${{ matrix.domain }}"

  ai-review-push:
    name: AI Staff Code Review (push, summary only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run Belooga AI Reviewer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/ai-code-reviewer.py all
