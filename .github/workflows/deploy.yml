name: Belooga Deploy (GHCR + Kubernetes)

# Runs after CI succeeds on main, or manually. Images are tagged with the commit SHA.
# Required setup (see README "Deployment"): environment `production` with required
# reviewers; secret KUBE_CONFIG (base64 kubeconfig) on that environment; optional repo
# variables NEXT_PUBLIC_API_URL / NEXT_PUBLIC_SITE_URL / KUBE_NAMESPACE.
on:
  workflow_run:
    workflows: ["Belooga SSOT & Integrity CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/farmer911/belooga-backend
  FRONTEND_IMAGE: ghcr.io/farmer911/belooga-frontend
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build & Push Images
    # workflow_run's branch filter also matches fork PRs whose head branch is "main",
    # so require a successful *push* run from this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.belooga.com' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://belooga.com' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # configure required reviewers in repo settings
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'default' }}
    steps:
      - name: Check cluster credentials
        id: kube
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::notice::KUBE_CONFIG secret not set - images pushed, cluster deploy skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        if: steps.kube.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup kubectl
        if: steps.kube.outputs.ok == 'true'
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Write kubeconfig
        if: steps.kube.outputs.ok == 'true'
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Run database migrations
        if: steps.kube.outputs.ok == 'true'
        run: |
          kubectl -n "$KUBE_NAMESPACE" delete job belooga-migrate --ignore-not-found
          sed "s#${BACKEND_IMAGE}:latest#${BACKEND_IMAGE}:${RELEASE_SHA}#" k8s/migrate-job.yaml \
            | kubectl -n "$KUBE_NAMESPACE" apply -f -
          if ! kubectl -n "$KUBE_NAMESPACE" wait --for=condition=complete job/belooga-migrate --timeout=300s; then
            kubectl -n "$KUBE_NAMESPACE" logs job/belooga-migrate --tail=200 || true
            exit 1
          fi

      - name: Apply manifests & roll out
        if: steps.kube.outputs.ok == 'true'
        run: |
          cat k8s/deployment-and-hpa.yaml <(echo '---') k8s/frontend.yaml \
            | sed -e "s#${BACKEND_IMAGE}:latest#${BACKEND_IMAGE}:${RELEASE_SHA}#" \
                  -e "s#${FRONTEND_IMAGE}:latest#${FRONTEND_IMAGE}:${RELEASE_SHA}#" \
            | kubectl -n "$KUBE_NAMESPACE" apply -f -
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/belooga-backend --timeout=300s
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/belooga-frontend --timeout=300s
