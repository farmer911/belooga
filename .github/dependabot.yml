version: 2

# Minor/patch bumps are grouped into one PR per ecosystem; majors stay separate.
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/qc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      qc-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
