version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: belooga-postgres
    restart: always
    environment:
      POSTGRES_USER: belooga
      POSTGRES_PASSWORD: belooga_secret_password
      POSTGRES_DB: belooga_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belooga -d belooga_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: belooga-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: belooga-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://belooga:belooga_secret_password@postgres:5432/belooga_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev_jwt_secret_key_change_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
